---
- name: Automatizar tareas en los 5 servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: yes

    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Crear carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear archivo hola.txt
      ansible.builtin.copy:
        content: "Hola desde Ansible. Practica 8 ITLA.\n"
        dest: /home/itla/app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present